- id: SESS-007
  legacy: [P16]
  title: Reloading the window ten times and quitting leaves nothing behind
  suite: main
  scenario: U4
  priority: medium
  type: performance
  purpose: After ten window reloads and quitting, no runtime is left and handle counts are back at the start.
  preconditions:
    world: user
  steps:
    - do: Reload the window ten times.
      expect: The app works after each.
    - do: Quit.
      expect: No runtime process is left; handles back at the baseline.
  limits:
    - { what: processes left 15 s after quitting, line: none, by: release playbook P16 }
    - { what: host handles after ten reloads, line: none decided; recorded only, by: nobody decided }
  measures: [processCount, handleCount, quitMs]
  languages: [en, ja]
  automation:
    status: automated
    impl: { file: release-playbook.mjs, case: P16 Reloading the window ten times and quitting leaves nothing behind }
  added: 1.1.5

- id: SESS-008
  legacy: [P17, "#33"]
  title: A draft stays in its own session
  suite: regression
  scenario: U4
  priority: medium
  type: functional
  purpose: Text typed but not sent in one session never shows in another session's composer.
  preconditions:
    world: user
  steps:
    - do: Type a draft in one session without sending; open another session.
      expect: The other composer is empty.
    - do: Go back.
      expect: The draft is there.
  languages: [en]
  automation:
    status: automated
    impl: { file: abnormal-playbook.mjs, case: "#33 A draft stays in its own session" }
    note: P17 also asks for drafts across folders and after a reload; those parts are planned.
  links: ["#33"]

- id: SESS-009
  title: Old and damaged saved sessions
  suite: abnormal
  scenario: U9
  priority: medium
  type: functional
  purpose: Sessions written by earlier versions, half-written or empty, are listed without breaking the list; opening one shows its history or one plain reason, never a spinner; a new session still works.
  preconditions:
    world: user
    state: The world's saved sessions in an older format, cut off mid-line, with an unknown entry, empty, and one whose folder was deleted.
  steps:
    - do: Open each damaged session.
      expect: Its history or one plain reason shows; no spinner stays.
    - do: Open a new session and send.
      expect: The reply arrives.
  languages: [en, ja]
  automation:
    status: automated
    impl: { file: abnormal-playbook.mjs, case: Old and damaged saved sessions }

