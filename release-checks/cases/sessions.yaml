- id: REG-212
  legacy: ["#212"]
  title: A background session's live state shows in the list
  suite: regression
  scenario: U4
  priority: medium
  type: functional
  purpose: A session writing a reply while another is open shows as running; once done it shows as finished until opened; a stopped reply shows as a session at rest.
  preconditions:
    world: user
  steps:
    - do: Start a long reply and open a new session.
      expect: The first row shows running, then finished.
    - do: Start another reply, stop it, open a new session.
      expect: That row shows a session at rest.
  languages: [en, ja]
  automation:
    status: automated
    impl: { file: abnormal-playbook.mjs, case: "#212 A background session's live state shows in the list" }
  links: ["#212"]

- id: REG-162
  legacy: ["#162"]
  title: Waiting messages come back paused after a restart
  suite: regression
  scenario: U4
  priority: high
  type: functional
  purpose: A message waiting in the queue is kept across a restart of the app, paused, with Continue and Discard; Continue sends it once.
  preconditions:
    world: user
  data: A provider that does not answer (fixture hang).
  steps:
    - do: Send a message to a provider that hangs; queue a second message.
      expect: The second waits in the queue.
    - do: Restart the app.
      expect: The waiting message is back, paused, with Continue and Discard.
    - do: Press Continue.
      expect: It is sent once.
  languages: [en]
  automation:
    status: automated
    impl: { file: abnormal-playbook.mjs, case: "#162 Waiting messages come back paused after a restart" }
  links: ["#162"]

