# Starting the app and saved sessions (scenarios U4, U9).
- id: START-001
  legacy: [P1]
  title: Cold start opens the last session
  suite: smoke
  scenario: U4
  priority: high
  type: functional
  purpose: After the app is closed and opened again, loading ends on the session the person was in. Its history and title are there and a message can be sent at once.
  preconditions:
    world: user
  data: Fixture model (arithmetic questions with known answers).
  steps:
    - do: Open a new session and send a message.
      expect: The reply arrives.
    - do: Close the app and open it again.
      expect: When loading ends the same session is shown with its history and title, within 30 s.
    - do: Send the next message at once.
      expect: The reply arrives within 30 s.
  measures: [openToHistoryMs, hostStartToLoadingReadyMs]
  languages: [en, ja]
  automation:
    status: automated
    impl: { file: release-playbook.mjs, case: P1 Cold start opens the last session }
  added: 1.1.5

- id: START-002
  legacy: [P2]
  title: Without a remembered session the folder's latest one opens
  suite: main
  scenario: U9
  priority: high
  type: functional
  purpose: When the window remembers only the folder, its most recent session opens with its whole history, tool results included.
  preconditions:
    world: user
  data: A reply that runs a tool (fixture TOOL).
  steps:
    - do: Send a message whose reply uses a tool.
      expect: The tool result and the reply show.
    - do: Make the window forget the session (keep the folder) and start the app again.
      expect: The folder's latest session opens with its whole history, the tool result included.
  languages: [en, ja]
  automation:
    status: automated
    impl: { file: release-playbook.mjs, case: P2 Without a remembered session the folder's latest one opens }
  added: 1.1.5

- id: SESS-001
  legacy: [P3, P5]
  title: Sending in an old session keeps it whole
  suite: main
  scenario: U9
  priority: high
  type: functional
  purpose: Opening an old session of the same folder and sending keeps the history and title, writes the same file, adds no row; after a reload and a full restart it is still there.
  preconditions:
    world: user
  steps:
    - do: Make a session with one answered message; restart the app; open another session.
      expect: Both are listed.
    - do: Click the old session.
      expect: Its history shows (proposed line 1 s, not decided; the case notes it).
    - do: Send a message.
      expect: The reply arrives; the earlier history stays; exactly that session's file grows; no new file with its messages; no new row; the title is unchanged.
    - do: Reload the window, then restart the app.
      expect: The old session is still listed both times.
  limits:
    - { what: click to history, line: 1 s, by: "proposed, not decided" }
  measures: [clickToHistoryMs]
  languages: [en, ja]
  automation:
    status: automated
    impl: { file: release-playbook.mjs, case: P3 P5 Sending in an old session keeps it whole }
  added: 1.1.5

- id: SESS-002
  legacy: [P4]
  title: An old session of another folder stays in its folder
  suite: main
  scenario: U11
  priority: high
  type: functional
  purpose: Opening an old session that belongs to another folder and sending behaves as SESS-001, and the session stays in its own folder (the file header says which).
  preconditions:
    world: user
    state: A second folder added to the app.
  steps:
    - do: Add a second folder; start a new session there with the folder picker; send a message.
      expect: The reply arrives; the session file's header names the second folder.
    - do: Restart the app; open a session of the first folder; then click the old session of the second folder.
      expect: Its history shows within 10 s.
    - do: Send a message.
      expect: The reply arrives; it is written to the same file; the header still names the second folder; no new file holds its messages; it is listed under the second folder, also after a reload.
  languages: [en, ja]
  automation:
    status: automated
    impl: { file: release-playbook.mjs, case: P4 An old session of another folder stays in its folder }
    note: A new session file without messages (a prepared session) appearing meanwhile is recorded as a note.
  added: 1.1.5

- id: SESS-003
  legacy: [P6]
  title: A very large old session (20 MB or more) opens and answers
  suite: main
  scenario: U9
  priority: medium
  type: performance
  purpose: The history of a very large session is readable at once, sending does not freeze the window, and the status first says it is starting.
  preconditions:
    world: user
    state: A saved session of 20 MB or more (a generated one, never a person's real session).
  steps:
    - do: Click the large session.
      expect: Its history is readable at once.
    - do: Send a message.
      expect: The window stays responsive; the status shows starting, then the reply arrives.
  limits:
    - { what: click to history, line: 1 s regardless of file size, by: "proposed, not decided" }
    - { what: window not answering while the session starts, line: none decided; recorded only, by: nobody decided }
  measures: [sessionHistoryMs, firstOutputMs, longestFreezeMs]
  languages: [en, ja]
  automation:
    status: automated
    impl: { file: release-playbook.mjs, case: P6 A very large old session opens and answers }
  added: 1.1.5

- id: SESS-004
  legacy: [P9]
  title: Switching away and back shows the reply as it was live
  suite: main
  scenario: U4
  priority: high
  type: functional
  purpose: Switching to another session and back, while a reply runs and after it ended, shows the same tool calls and results as live, never "Unsupported content".
  preconditions:
    world: user
  steps:
    - do: Start a reply with tool calls; switch to another session and back while it runs.
      expect: The tool calls and results match what was shown live.
    - do: Switch away and back after it ended.
      expect: The same; no "Unsupported content".
  measures: [switchMs]
  languages: [en, ja]
  automation:
    status: automated
    impl: { file: release-playbook.mjs, case: P9 Switching away and back shows the reply as it was live }
  added: 1.1.5

- id: SESS-005
  legacy: [P10]
  title: A background session keeps its state in the list
  suite: main
  scenario: U4
  priority: medium
  type: functional
  purpose: A session nobody is looking at keeps its state up to date in the list and is complete when opened again.
  preconditions:
    world: user
  steps:
    - do: Start a reply and open another session.
      expect: The first session's row shows it is running, then finished.
    - do: Open the first session again.
      expect: The whole reply is there.
  measures: [stateDelayMs]
  languages: [en, ja]
  automation:
    status: automated
    impl: { file: release-playbook.mjs, case: P10 A background session keeps its state in the list }
    note: The list state part is REG-212.
  added: 1.1.5

