  automation:
    status: automated
    impl: { file: abnormal-playbook.mjs, case: Missing tools.json }

- id: REG-173
  legacy: ["#173"]
  title: An environment change reaches the open session
  suite: regression
  scenario: U8
  priority: high
  type: functional
  purpose: A variable changed in Settings > Environment is used by the session already open, without restarting the app.
  preconditions: { world: user }
  data: The fixture requires a new key; the provider's key comes from an environment variable.
  steps:
    - do: Send with the old key.
      expect: The key is refused.
    - do: Set the new key in Settings > Environment and save.
      expect: Saved, no error.
    - do: Send again in the same session.
      expect: The reply arrives without restarting the app.
  languages: [en]
  automation:
    status: automated
    impl: { file: abnormal-playbook.mjs, case: "#173 An environment change reaches the open session" }
  links: ["#173"]

