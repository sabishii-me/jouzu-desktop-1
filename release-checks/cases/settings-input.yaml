# Settings (U8), folders (U11), what the person sends (U4).
- id: SET-001
  title: Rapid settings changes
  suite: abnormal
  scenario: U8
  priority: medium
  type: functional
  purpose: Changing a setting many times quickly never fails with "another operation is running", ends on the last choice and survives a reload.
  preconditions: { world: user }
  steps:
    - do: Change the interface language many times in a row.
      expect: No "another operation is running"; the last choice is shown.
    - do: Reload.
      expect: The last choice is kept.
  languages: [en]
  automation:
    status: automated
    impl: { file: abnormal-playbook.mjs, case: Rapid settings changes }

- id: SET-002
  title: Settings file cannot be written
  suite: abnormal
  scenario: U8
  priority: high
  type: functional
  purpose: When a setting cannot be saved, that card says so in plain words, nothing moves, and nothing else stops working.
  preconditions:
    world: user
    state: settings.json made read-only for this user (the case runs as a normal user).
  steps:
    - do: Change a setting that is saved in settings.json.
      expect: The card says it was not saved, in plain words; nothing moves.
    - do: Make the file writable again; send a message.
      expect: The reply arrives.
  languages: [en, ja]
  automation:
    status: automated
    impl: { file: abnormal-playbook.mjs, case: Settings file cannot be written }

- id: SET-003
  title: Missing tools.json
  suite: abnormal
