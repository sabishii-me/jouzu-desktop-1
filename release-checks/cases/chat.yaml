# Everyday chat: new sessions, replies, Stop, the queue (scenario U4).
- id: CHAT-001
  legacy: [P7]
  title: A new session answers at once
  suite: smoke
  scenario: U4
  priority: high
  type: performance
  purpose: A new session in this folder can be used at once.
  preconditions:
    world: user
  steps:
    - do: Open a new session and send a message.
      expect: From the host taking the message to the reply's first output is under 2 s.
  limits:
    - { what: message.accepted to message.first_output, line: "fail above 2 s, target 0.5 s", by: product owner 2026-11-13 }
  measures: [acceptedToFirstOutputMs]
  languages: [en, ja]
  automation:
    status: automated
    impl: { file: release-playbook.mjs, case: P7 A new session answers at once }
  added: 1.1.5

- id: CHAT-002
  legacy: [P8]
  title: A new session while another one is running
  suite: main
  scenario: U4
  priority: high
  type: functional
  purpose: A new session can be opened while another reply runs; the running one is not affected and both rows show their state.
  preconditions:
    world: user
  steps:
    - do: Start a long reply; open a new session and send there.
      expect: Both replies arrive; both rows show their state.
  automation:
    status: planned

- id: CHAT-003
  legacy: [P11]
  title: Stop while a tool runs
  suite: smoke
  scenario: U4
  priority: high
  type: functional
  purpose: Stop while a tool is running ends the turn safely, the tool shows as stopped (not running), nothing is shown as an error, and the next message is answered.
  preconditions:
    world: user
  data: A reply that runs a 30 s command (fixture TOOLWAIT).
  steps:
    - do: Send a message whose reply runs a long command; wait until it shows as running.
      expect: The status names the running tool.
    - do: Press Stop.
      expect: Send comes back within 2 s; no problem is shown; the tool no longer shows as running.
    - do: Send the next message.
      expect: The reply arrives.
  limits:
    - { what: Stop to Send back, line: 2 s, by: release playbook }
  measures: [stopToSendMs, recoveredReplyMs]
  languages: [en, ja]
  automation:
    status: automated
    impl: { file: release-playbook.mjs, case: P11 Stop while a tool runs }
    note: Stop while starting and while writing are CHAT-017 and CHAT-019.
  added: 1.1.5

- id: CHAT-004
