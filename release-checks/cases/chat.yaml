- id: CHAT-008
  legacy: [P25]
  title: Automatic retry and context compaction are shown
  suite: main
  scenario: U6
  priority: medium
  type: functional
  purpose: A failed model request that is retried shows "request failed, retry a/b (reason)"; compaction shows as such; neither looks stuck.
  preconditions:
    world: user
  steps:
    - do: Make the provider fail once, then answer.
      expect: The status shows the retry with its count and reason; the reply arrives.
    - do: Fill the context until it is compacted.
      expect: The status shows compaction.
  automation:
    status: planned

- id: CHAT-009
  legacy: [P26]
  title: A tool stopped or cut off shows as interrupted
  suite: main
  scenario: U7
  priority: high
  type: functional
  purpose: A tool stopped half-way, or cut off when the runtime ends, shows as interrupted or failed, never still running; the next turn works; in old sessions a tool without a result also shows as interrupted.
  preconditions:
    world: user
  steps:
    - do: Stop while a tool runs; then end the runtime while another tool runs.
      expect: Both tools show as interrupted; none as running.
    - do: Open an old session with a tool call that has no result.
      expect: That tool shows as interrupted.
  automation:
    status: planned
    note: The Stop part is CHAT-003.

- id: CHAT-010
  legacy: [P27]
  title: Two messages sent while a reply runs are each used once
  suite: main
  scenario: U4
  priority: high
  type: functional
  purpose: While a reply runs, two messages go to the queue above the composer and the button says Steer; the runtime takes them in order, each shows once in the conversation, the model is asked about each once, and the queue empties.
  preconditions:
    world: user
  steps:
    - do: Start a long reply; send two messages.
      expect: Both wait in the queue in order, not yet in the conversation; the button says Steer.
    - do: Wait for the reply to end.
      expect: Each shows once in the conversation, in order; the provider was asked about each once; the queue is empty.
  languages: [en, ja]
  automation:
    status: automated
    impl: { file: release-playbook.mjs, case: P27 Two messages sent while a reply runs are each used once }
  added: 1.1.5

- id: CHAT-011
  legacy: [P28]
  title: Queued messages can be deleted, edited and kept on Stop
  suite: main
  scenario: U4
  priority: high
  type: functional
  purpose: A deleted queued message is never sent; Edit puts its text and image back in the composer; after Stop the rest wait with Continue and Discard, Continue sends once, and Stop is not shown as an error.
  preconditions:
    world: user
  steps:
    - do: Queue three messages during a long reply; delete one; edit one.
      expect: The deleted one is gone; the edited one is back in the composer.
    - do: Press Stop.
      expect: The rest wait with Continue and Discard; no error shows.
    - do: Press Continue.
      expect: Each waiting message is sent once; the deleted one never.
  languages: [en, ja]
  automation:
    status: automated
    impl: { file: release-playbook.mjs, case: "P28 Queued messages can be deleted, edited and kept on Stop" }
  added: 1.1.5

