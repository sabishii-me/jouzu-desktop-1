- id: CHAT-006
  legacy: [P23]
  title: A reply with many steps keeps every step on screen
  suite: main
  scenario: U4
  priority: high
  type: functional
  purpose: In a reply of five or more steps (thinking, tool, thinking) each step's reasoning and tool stay on screen; after a reload and a restart it looks the same.
  preconditions:
    world: user
  data: Fixture STEPS:n reply.
  steps:
    - do: Send a message whose reply takes 6 steps.
      expect: Every step's thinking and tool stay on screen; none disappears after the second.
    - do: Reload, then restart the app.
      expect: The reply looks the same.
  measures: [stepWaitMs]
  automation:
    status: planned

