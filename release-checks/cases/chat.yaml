- id: UI-001
  legacy: [P29]
  title: Problems and notices are shown in their place
  suite: main
  scenario: U4
  priority: high
  type: functional
  purpose: No floating notice or pop-up at the top; a session's notices appear in one place above the composer in one style (a sentence, an action, details); app-level errors stay in Settings, the folder list or their panel; no raw technical text on screen except under Details.
  preconditions:
    world: user
  steps:
    - do: At the end of every case, look at the whole window.
      expect: No floating notice; no raw technical text as a main sentence.
  languages: [en, ja]
  automation:
    status: automated
    impl: { file: release-playbook.mjs, check: endCheck }
    note: Not a case of its own. Every release-playbook case runs this end check; abnormal cases run the same judgements (judgeShown).
  added: 1.1.5
