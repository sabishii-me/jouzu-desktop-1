[package]
name = "jouzu-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Jouzu runtime host: serves the UI and the first /v1 contract slice"

[[bin]]
name = "jouzu-host"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util", "process", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
percent-encoding = "2"
async-stream = "0.3"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Diagnostics_ToolHelp"] }

